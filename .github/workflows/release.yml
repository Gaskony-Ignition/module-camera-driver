name: Build, Release & Publish to Portal

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up module signing
        run: |
          SIGNING_DIR="${HOME}/.ignition-signing"
          mkdir -p "$SIGNING_DIR"
          echo "${SIGNING_KEYSTORE_B64}" | base64 -d > "$SIGNING_DIR/gaskony-keystore.jks"
          echo "${SIGNING_CERT_B64}" | base64 -d > "$SIGNING_DIR/gaskony-cert.pem"
          {
            echo "ignition.signing.keystoreFile=${SIGNING_DIR}/gaskony-keystore.jks"
            echo "ignition.signing.keystorePassword=${SIGNING_PASSWORD}"
            echo "ignition.signing.certAlias=gaskony-module"
            echo "ignition.signing.certPassword=${SIGNING_PASSWORD}"
            echo "ignition.signing.certFile=${SIGNING_DIR}/gaskony-cert.pem"
          } > gradle.properties
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build module
        run: ./gradlew clean build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Find and verify signed modl file
        id: modl
        run: |
          MODL_FILE=$(find build -maxdepth 1 -name "CameraDriver-*.modl" ! -name "*.unsigned.modl" | head -1)
          if [ -z "$MODL_FILE" ]; then
            echo "ERROR: No signed .modl file found in build/"
            ls -la build/
            exit 1
          fi
          if ! unzip -l "$MODL_FILE" | grep -q "certificates.p7b"; then
            echo "ERROR: Module appears unsigned (no certificates.p7b in modl)"
            exit 1
          fi
          echo "file=$MODL_FILE" >> $GITHUB_OUTPUT
          echo "Verified signed module: $MODL_FILE"

      - name: Create source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          MODL_FILE: ${{ steps.modl.outputs.file }}
        run: |
          # Delete existing release if present (e.g. created manually)
          gh release delete "${REF_NAME}" --yes 2>/dev/null || true
          gh release create "${REF_NAME}" \
            "${MODL_FILE}" \
            --title "Camera Driver ${REF_NAME}" \
            --generate-notes

      - name: Create portal release
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          MODL_FILE: ${{ steps.modl.outputs.file }}
        run: |
          TAG="camera-driver-${REF_NAME}"

          # Delete existing portal release if present
          gh release delete "$TAG" --repo Gaskony-Ignition/ignition-modules-portal --yes 2>/dev/null || true
          gh api repos/Gaskony-Ignition/ignition-modules-portal/git/refs/tags/"$TAG" -X DELETE 2>/dev/null || true

          gh release create "$TAG" \
            "${MODL_FILE}" \
            --repo Gaskony-Ignition/ignition-modules-portal \
            --title "Camera Driver v${VERSION}" \
            --notes "## Camera Driver v${VERSION}

          Multi-protocol camera integration for Ignition 8.3+

          **Protocols:** ONVIF, RTSP, MJPEG, Snapshot URL

          ### Installation
          1. Download \`CameraDriver-${VERSION}.modl\` below
          2. Ignition Gateway: Config > System > Modules > Install or Upgrade
          3. Upload the .modl file

          **Requires:** Ignition 8.3+ | Java 17"

      - name: Update portal README
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Gaskony-Ignition/ignition-modules-portal.git /tmp/portal
          cd /tmp/portal

          export VERSION
          python3 -c "
          import re, os
          VERSION = os.environ['VERSION']
          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'CameraDriver-[\d.]+\.modl', f'CameraDriver-{VERSION}.modl', content)
          content = re.sub(r'camera-driver-v[\d.]+', f'camera-driver-v{VERSION}', content)
          content = re.sub(
              r'(### Camera Driver.*?\*\*Latest Version\*\* \| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content, flags=re.DOTALL, count=1
          )
          content = re.sub(
              r'(\| Camera Driver\s*\| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content
          )
          with open('README.md', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update Camera Driver to v${VERSION}"
          git push
