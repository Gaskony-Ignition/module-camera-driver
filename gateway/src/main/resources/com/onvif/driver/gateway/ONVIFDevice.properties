# ONVIF Driver Device
# i18n properties for device display in Ignition Gateway

# Device metadata - appears in device connection dropdown
ONVIFDevice.Meta.DisplayName=ONVIF Driver
ONVIFDevice.Meta.Description=Connect to ONVIF-compatible IP cameras and devices for data integration

# Category names
GENERAL=General
CONNECTION=Connection
ONVIF=ONVIF Settings

# General settings
ONVIFDevice.General.DeviceName=Device Name
ONVIFDevice.General.DeviceName.Desc=Unique name for this ONVIF device connection
ONVIFDevice.General.Enabled=Enabled
ONVIFDevice.General.Enabled.Desc=Enable or disable this device connection

# Connection settings
ONVIFDevice.Connection.IpAddress=IP Address
ONVIFDevice.Connection.IpAddress.Desc=IP address of the ONVIF device (e.g., 192.168.1.100)
ONVIFDevice.Connection.Port=Port
ONVIFDevice.Connection.Port.Desc=ONVIF service port (default: 80 for HTTP, 443 for HTTPS)
ONVIFDevice.Connection.Username=Username
ONVIFDevice.Connection.Username.Desc=ONVIF authentication username
ONVIFDevice.Connection.Password=Password
ONVIFDevice.Connection.Password.Desc=ONVIF authentication password
ONVIFDevice.Connection.UseHttps=Use HTTPS
ONVIFDevice.Connection.UseHttps.Desc=Connect using HTTPS instead of HTTP
ONVIFDevice.Connection.Timeout=Connection Timeout (seconds)
ONVIFDevice.Connection.Timeout.Desc=Timeout for connecting to the device

# ONVIF settings
ONVIFDevice.ONVIF.AutoDiscover=Auto-discover Services
ONVIFDevice.ONVIF.AutoDiscover.Desc=Automatically discover available ONVIF services
ONVIFDevice.ONVIF.PollInterval=Poll Interval (seconds)
ONVIFDevice.ONVIF.PollInterval.Desc=How often to poll device for data updates
ONVIFDevice.ONVIF.ServiceType=Service Type
ONVIFDevice.ONVIF.ServiceType.Desc=Type of ONVIF service to connect to

# Service Type enum values
DEVICE=Device Management
MEDIA=Media Service
PTZ=PTZ Control
IMAGING=Imaging Settings
ANALYTICS=Analytics

# Validation messages
ONVIFDevice.Validation.DeviceNameRequired=Device name is required
ONVIFDevice.Validation.IpAddressRequired=IP address is required
ONVIFDevice.Validation.InvalidIpAddress=Invalid IP address format: {0}
ONVIFDevice.Validation.PortRange=Port must be between 1 and 65535
ONVIFDevice.Validation.UsernameRequired=Username is required
ONVIFDevice.Validation.PasswordRequired=Password is required
ONVIFDevice.Validation.TimeoutMin=Connection timeout must be at least 1 second
ONVIFDevice.Validation.PollIntervalMin=Poll interval must be at least 1 second
