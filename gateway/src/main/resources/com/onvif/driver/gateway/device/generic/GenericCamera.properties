# Generic Camera Device
# i18n properties for device display in Ignition Gateway

# Device metadata - appears in device connection dropdown
Meta.DisplayName=Generic Camera
Meta.Description=Connect to IP cameras using RTSP, snapshot, or MJPEG URLs (no ONVIF required)

# Category names
GENERAL=General
CAMERA_CONNECTION=Camera Connection
STREAM_SETTINGS=Stream Settings

# General settings
General.Enabled=Enabled
General.Enabled.Desc=Enable or disable this device connection

# Camera Connection settings
CameraConnection.RtspUrl=RTSP URL
CameraConnection.RtspUrl.Desc=RTSP stream URL (e.g., rtsp://192.168.1.50:554/stream1)
CameraConnection.SnapshotUrl=Snapshot URL
CameraConnection.SnapshotUrl.Desc=HTTP URL for JPEG snapshots (e.g., http://192.168.1.50/snapshot.jpg)
CameraConnection.MjpegUrl=MJPEG URL
CameraConnection.MjpegUrl.Desc=MJPEG stream URL (e.g., http://192.168.1.50/mjpeg)
CameraConnection.Username=Username
CameraConnection.Username.Desc=Camera authentication username (optional)
CameraConnection.Password=Password
CameraConnection.Password.Desc=Camera authentication password (optional)
CameraConnection.Timeout=Connection Timeout (seconds)
CameraConnection.Timeout.Desc=Timeout for HTTP connections to the camera

# Stream Settings
StreamSettings.DefaultFps=Default Frame Rate (FPS)
StreamSettings.DefaultFps.Desc=Default frame rate for snapshot-polling MJPEG streams (1-30)

# Validation messages
Validation.UrlRequired=At least one URL (RTSP, Snapshot, or MJPEG) must be provided
Validation.InvalidRtspUrl=Invalid RTSP URL format. Must start with rtsp:// or rtsps://
Validation.InvalidHttpUrl=Invalid URL format. Must start with http:// or https://
Validation.TimeoutMin=Connection timeout must be at least 1 second
Validation.FpsRange=Default frame rate must be between 1 and 30
