# ONVIF Camera Device
# i18n properties for the ONVIF device type in the Camera Driver module
# NOTE: Bundle name "ONVIFDevice" is automatically prepended by BundleUtil for non-qualified keys

# Device metadata - appears in device connection dropdown
Meta.DisplayName=ONVIF Camera
Meta.Description=Connect to ONVIF-compatible IP cameras via SOAP protocol with PTZ, streaming, and service discovery

# Category names
GENERAL=General
CONNECTION=Connection
ONVIF=ONVIF Settings

# General settings
General.DeviceName=Device Name
General.DeviceName.Desc=Unique name for this camera connection
General.Enabled=Enabled
General.Enabled.Desc=Enable or disable this device connection

# Connection settings
Connection.IpAddress=IP Address
Connection.IpAddress.Desc=IP address of the camera (e.g., 192.168.1.100)
Connection.Port=Port
Connection.Port.Desc=ONVIF service port (default: 80 for HTTP, 443 for HTTPS)
Connection.Username=Username
Connection.Username.Desc=Camera authentication username
Connection.Password=Password
Connection.Password.Desc=Camera authentication password
Connection.UseHttps=Use HTTPS
Connection.UseHttps.Desc=Connect using HTTPS instead of HTTP
Connection.Timeout=Connection Timeout (seconds)
Connection.Timeout.Desc=Timeout for connecting to the camera

# ONVIF settings
ONVIF.AutoDiscover=Auto-discover Services
ONVIF.AutoDiscover.Desc=Automatically discover available ONVIF services
ONVIF.PollInterval=Poll Interval (seconds)
ONVIF.PollInterval.Desc=How often to poll the camera for data updates
ONVIF.ServiceType=Service Type
ONVIF.ServiceType.Desc=Type of ONVIF service to connect to

# Service Type enum values - THESE are what show in the dropdown!
# NOTE: These use full qualified class names, so NO bundle prefix is added
ONVIFDeviceConfig.ServiceType.DEVICE=Device Management
ONVIFDeviceConfig.ServiceType.MEDIA=Media Service
ONVIFDeviceConfig.ServiceType.PTZ=PTZ Control
ONVIFDeviceConfig.ServiceType.IMAGING=Imaging Settings
ONVIFDeviceConfig.ServiceType.ANALYTICS=Analytics

# Validation messages
Validation.DeviceNameRequired=Device name is required
Validation.IpAddressRequired=IP address is required
Validation.InvalidIpAddress=Invalid IP address format: {0}
Validation.PortRange=Port must be between 1 and 65535
Validation.UsernameRequired=Username is required
Validation.PasswordRequired=Password is required
Validation.TimeoutMin=Connection timeout must be at least 1 second
Validation.PollIntervalMin=Poll interval must be at least 1 second
