# Camera Device
# i18n properties for the unified Camera device type in the Camera Driver module

# Device metadata - appears in device connection dropdown
Meta.DisplayName=Camera
Meta.Description=IP camera connection with automatic ONVIF, RTSP, and snapshot detection

# Category names
GENERAL=General
CONNECTION=Connection
ADVANCED=Advanced

# General settings
General.Enabled=Enabled
General.Enabled.Desc=Enable or disable this device connection

# Connection settings
Connection.IpAddress=IP Address
Connection.IpAddress.Desc=IP address of the camera (e.g., 192.168.1.100)
Connection.Port=Port
Connection.Port.Desc=Camera port (default: 80 for HTTP, 443 for HTTPS)
Connection.Username=Username
Connection.Username.Desc=Camera authentication username (optional)
Connection.Password=Password
Connection.Password.Desc=Camera authentication password (optional)
Connection.Timeout=Connection Timeout (seconds)
Connection.Timeout.Desc=Timeout for connecting to the camera

# Stream types
STREAMS=Streams
Streams.EnableRtsp=RTSP Stream
Streams.EnableRtsp.Desc=Enable RTSP video streaming (auto-detected on port 554)
Streams.EnableSnapshot=Snapshot
Streams.EnableSnapshot.Desc=Enable HTTP snapshot capture
Streams.EnableMjpeg=MJPEG Stream
Streams.EnableMjpeg.Desc=Enable MJPEG video streaming
Streams.EnableOnvif=ONVIF / PTZ
Streams.EnableOnvif.Desc=Enable ONVIF protocol for PTZ control and service discovery

# Advanced settings
Advanced.RtspUrl=RTSP URL Override
Advanced.RtspUrl.Desc=Override RTSP stream URL (e.g., rtsp://192.168.1.50:554/stream1). Leave empty for auto-detection via ONVIF.
Advanced.SnapshotUrl=Snapshot URL Override
Advanced.SnapshotUrl.Desc=Override snapshot URL (e.g., http://192.168.1.50/snapshot.jpg). Leave empty for auto-detection via ONVIF.
Advanced.MjpegUrl=MJPEG URL Override
Advanced.MjpegUrl.Desc=Override MJPEG stream URL (e.g., http://192.168.1.50/mjpeg). Leave empty for auto-detection.
Advanced.UseHttps=Use HTTPS
Advanced.UseHttps.Desc=Connect using HTTPS instead of HTTP
Advanced.SslValidationMode=SSL/TLS Validation Mode
Advanced.SslValidationMode.Desc=Certificate validation mode for HTTPS connections (STRICT recommended for production)
Advanced.PollInterval=Poll Interval (seconds)
Advanced.PollInterval.Desc=How often to poll the camera for data updates (ONVIF only, 0 to disable)

# SSL Validation Mode enum values
CameraConfig.SslValidationMode.STRICT=Strict - Full certificate validation (production)
CameraConfig.SslValidationMode.TRUST_FIRST_USE=Trust First Use - Accept and pin self-signed on first connection
CameraConfig.SslValidationMode.INSECURE=Insecure - Accept any certificate (development only)

# Validation messages
Validation.IpAddressRequired=IP address is required
Validation.InvalidIpAddress=Invalid IP address format: {0}
Validation.PortRange=Port must be between 1 and 65535
Validation.TimeoutMin=Connection timeout must be at least 1 second
Validation.PollIntervalMin=Poll interval must be at least 0 seconds
