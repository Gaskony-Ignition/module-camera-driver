<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Driver - Ignition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Catppuccin Mocha palette (matches connection-browser.html) ───────── */
        :root {
            --bg-primary:   #11111b;
            --bg-secondary: #181825;
            --border:       #313244;
            --text-primary: #cdd6f4;
            --text-muted:   #a6adc8;
            --accent:       #89b4fa;
            --accent-hover: #b4d0ff;
            --font-sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        /* Heading bar */
        .dedicated-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            height: 32px;
            min-height: 32px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .dedicated-header svg {
            color: var(--accent);
            flex-shrink: 0;
        }

        /* Auth required overlay */
        .auth-required-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            background-color: var(--bg-primary);
        }

        .auth-required-card {
            text-align: center;
            padding: 48px 56px;
            border-radius: 12px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 440px;
        }

        .auth-required-card .auth-module-identity {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
        }

        .auth-required-card .auth-module-identity svg {
            color: var(--accent);
            flex-shrink: 0;
        }

        .auth-required-card .auth-divider {
            width: 48px;
            height: 1px;
            background: var(--border);
            margin: 20px auto;
        }

        .auth-required-card .auth-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .auth-required-card h2 {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .auth-required-card p {
            margin: 4px 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .auth-required-card .auth-login-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 10px 24px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease;
        }

        .auth-required-card .auth-login-btn:hover {
            background: var(--accent-hover);
        }

        /* Content iframe */
        .content-frame {
            width: 100%;
            flex: 1;
            border: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Heading Bar -->
        <div class="dedicated-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            <span>Camera Driver</span>
        </div>

        <!-- Auth required state -->
        <div id="authView" class="auth-required-overlay hidden">
            <div class="auth-required-card">
                <div class="auth-module-identity">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <span>Camera Driver</span>
                </div>
                <div class="auth-divider"></div>
                <div class="auth-icon">&#128274;</div>
                <h2>Authentication Required</h2>
                <p>You must be logged in to the Ignition Gateway to use this module.</p>
                <a href="/web/login" target="_top" class="auth-login-btn">
                    Log In to Gateway
                </a>
            </div>
        </div>

        <!-- Authenticated content (src set by JS to keep API_BASE as single source of truth) -->
        <iframe id="contentFrame" class="content-frame hidden"
                title="Camera Connection Browser"></iframe>
    </div>

    <script>
        // Single source of truth for API base path in this page.
        // If the module mount alias changes, update this constant and CameraDriverPaths.MOUNT_ALIAS.
        var API_BASE = '/data/camera-driver';

        // Set iframe src from the constant so the path is not duplicated in HTML attributes.
        document.getElementById('contentFrame').src = API_BASE + '/connection-browser';

        var currentState = null; // 'auth' or 'content'

        function showState(state) {
            if (state === currentState) return;
            currentState = state;

            var authView = document.getElementById('authView');
            var contentFrame = document.getElementById('contentFrame');

            if (state === 'auth') {
                authView.classList.remove('hidden');
                contentFrame.classList.add('hidden');
            } else {
                authView.classList.add('hidden');
                contentFrame.classList.remove('hidden');
            }
        }

        async function checkAuth() {
            try {
                // Use /auth-status which returns 200 with {authenticated: true/false}
                // instead of /diagnostics which returns 401 + WWW-Authenticate header
                // that triggers the browser's native Basic Auth popup
                var res = await fetch(API_BASE + '/auth-status', {
                    signal: AbortSignal.timeout(5000),
                    credentials: 'same-origin'
                });

                if (res.ok) {
                    var data = await res.json();
                    showState(data.authenticated ? 'content' : 'auth');
                } else {
                    showState('auth');
                }

            } catch (e) {
                // Connection error - treat as auth required
                showState('auth');
            }
        }

        // Check auth on load
        checkAuth();

        // CONTINUOUS auth monitoring every 10 seconds REGARDLESS of current state
        // This detects auth loss while content is showing (no browser popup)
        // and auto-recovers when user logs in via another tab
        setInterval(checkAuth, 10000);
    </script>
</body>
</html>
