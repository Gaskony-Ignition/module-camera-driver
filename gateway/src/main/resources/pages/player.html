<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Player</title>
    <style>
        :root {
            --bg-primary:   #11111b;
            --bg-secondary: #181825;
            --border:       #313244;
            --text-primary: #cdd6f4;
            --text-muted:   #a6adc8;
            --accent:       #89b4fa;
            --accent-hover: #b4d0ff;
            --error:        #f38ba8;
            --success:      #a6e3a1;
            --font-sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--bg-primary);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-family: var(--font-sans);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            font-size: 14px;
            color: var(--text-muted);
        }

        .error-message {
            font-size: 14px;
            color: var(--error);
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .retry-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <video id="video" autoplay muted playsinline></video>

    <div class="overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="message">Connecting to camera...</div>
    </div>

    <div class="overlay" id="errorOverlay" style="display:none">
        <div class="error-message" id="errorText"></div>
        <button class="retry-btn" onclick="startPlayer()">Retry</button>
    </div>

    <script src="/data/camera-driver/mse-player.js"></script>
    <script>
        var API_BASE = '/data/camera-driver';
        var player = null;

        function getDeviceName() {
            return new URLSearchParams(window.location.search).get('device');
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('errorOverlay').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorOverlay').style.display = 'flex';
        }

        function stopStream() {
            if (player) { player.stop(); player = null; }
        }

        async function startPlayer() {
            stopStream();

            var device = getDeviceName();
            if (!device) {
                showError('No device specified. Add ?device=YourDeviceName to the URL.');
                return;
            }

            showLoading();

            var videoEl = document.getElementById('video');
            player = new MsePlayer(videoEl, showError);

            videoEl.addEventListener('playing', function () {
                hideLoading();
            }, { once: true });

            await player.start(API_BASE + '/stream?device=' + encodeURIComponent(device));
        }

        document.addEventListener('DOMContentLoaded', startPlayer);
    </script>
</body>
</html>
