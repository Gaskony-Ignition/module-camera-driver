<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #1c1c22;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1c1c22;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e0e0e8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #3c3c44;
            border-top-color: #229ad6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            font-size: 14px;
            color: #8b8fa0;
        }

        .error-message {
            font-size: 14px;
            color: #e05555;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: #229ad6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .retry-btn:hover { background: #1a7fb3; }
    </style>
</head>
<body>
    <video id="video" autoplay muted playsinline></video>

    <div class="overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="message">Connecting to camera...</div>
    </div>

    <div class="overlay" id="errorOverlay" style="display:none">
        <div class="error-message" id="errorText"></div>
        <button class="retry-btn" onclick="startPlayer()">Retry</button>
    </div>

    <script>
        let streamReader = null;
        let mediaSource = null;
        let abortController = null;

        function getDeviceName() {
            return new URLSearchParams(window.location.search).get('device');
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('errorOverlay').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorOverlay').style.display = 'flex';
        }

        function stopStream() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            if (streamReader) {
                try { streamReader.cancel(); } catch (e) {}
                streamReader = null;
            }
            if (mediaSource && mediaSource.readyState === 'open') {
                try { mediaSource.endOfStream(); } catch (e) {}
            }
            mediaSource = null;
        }

        async function startPlayer() {
            stopStream();

            const device = getDeviceName();
            if (!device) {
                showError('No device specified. Add ?device=YourDeviceName to the URL.');
                return;
            }

            showLoading();

            if (!('MediaSource' in window)) {
                showError('Your browser does not support Media Source Extensions. Use Chrome, Edge, or Firefox.');
                return;
            }

            const videoEl = document.getElementById('video');
            mediaSource = new MediaSource();

            const sourceOpenPromise = new Promise((resolve) => {
                if (mediaSource.readyState === 'open') {
                    resolve();
                } else {
                    mediaSource.addEventListener('sourceopen', resolve, { once: true });
                }
            });

            videoEl.src = URL.createObjectURL(mediaSource);

            abortController = new AbortController();
            const streamUrl = '/data/camera-driver/stream?device=' + encodeURIComponent(device);

            let response;
            try {
                response = await fetch(streamUrl, {
                    credentials: 'include',
                    signal: abortController.signal
                });
            } catch (e) {
                if (e.name !== 'AbortError') showError('Failed to connect: ' + e.message);
                return;
            }

            if (!response.ok) {
                if (response.status === 401) {
                    showError('Authentication required. Please log in to the Ignition Gateway.');
                } else if (response.status === 404) {
                    showError('Device not found: ' + device);
                } else {
                    showError('Failed to connect: HTTP ' + response.status);
                }
                return;
            }

            await sourceOpenPromise;

            // Determine codec from Content-Type (go2rtc sends codec info)
            const contentType = (response.headers.get('Content-Type') || '')
                .replace(/;\s*charset=[^;]*/i, '').trim();
            let mimeCodec = contentType;
            if (!mimeCodec || !MediaSource.isTypeSupported(mimeCodec)) {
                const fallbacks = [
                    'video/mp4; codecs="avc1.640029,mp4a.40.2"',
                    'video/mp4; codecs="avc1.640029"',
                    'video/mp4; codecs="avc1.42E01E"'
                ];
                mimeCodec = fallbacks.find(c => MediaSource.isTypeSupported(c));
                if (!mimeCodec) {
                    showError('H.264 MP4 playback is not supported in this browser.');
                    return;
                }
            }

            const sourceBuffer = mediaSource.addSourceBuffer(mimeCodec);
            sourceBuffer.mode = 'segments';

            videoEl.addEventListener('playing', function() {
                hideLoading();
            }, { once: true });

            try {
                const reader = response.body.getReader();
                streamReader = reader;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    if (sourceBuffer.updating) {
                        await new Promise(resolve => {
                            sourceBuffer.addEventListener('updateend', resolve, { once: true });
                        });
                    }

                    try {
                        sourceBuffer.appendBuffer(value);
                        await new Promise(resolve => {
                            sourceBuffer.addEventListener('updateend', resolve, { once: true });
                        });
                    } catch (e) {
                        if (e.name === 'QuotaExceededError') {
                            if (sourceBuffer.buffered.length > 0 && !sourceBuffer.updating) {
                                const end = sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1);
                                sourceBuffer.remove(0, Math.max(0, end - 5));
                                await new Promise(resolve => {
                                    sourceBuffer.addEventListener('updateend', resolve, { once: true });
                                });
                                sourceBuffer.appendBuffer(value);
                                await new Promise(resolve => {
                                    sourceBuffer.addEventListener('updateend', resolve, { once: true });
                                });
                            }
                        } else {
                            console.error('SourceBuffer error:', e);
                            break;
                        }
                    }

                    // Trim buffer to prevent memory growth (keep ~30s)
                    try {
                        if (!sourceBuffer.updating && sourceBuffer.buffered.length > 0) {
                            const start = sourceBuffer.buffered.start(0);
                            const end = sourceBuffer.buffered.end(sourceBuffer.buffered.length - 1);
                            if (end - start > 30) {
                                sourceBuffer.remove(0, end - 15);
                                await new Promise(resolve => {
                                    sourceBuffer.addEventListener('updateend', resolve, { once: true });
                                });
                            }
                        }
                    } catch (e) { /* ignore trim errors */ }
                }

                // Stream ended normally
                showError('Stream ended. The camera may have disconnected.');
            } catch (e) {
                if (e.name !== 'AbortError') {
                    console.error('MSE stream error:', e);
                    showError('Stream connection lost: ' + e.message);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', startPlayer);
    </script>
</body>
</html>
