<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Player</title>
    <style>
        :root {
            /* Background palette - Catppuccin Mocha */
            --bg-primary:   #11111b;
            --bg-secondary: #181825;
            --bg-tertiary:  #1e1e2e;
            --bg-hover:     #313244;
            --bg-active:    #45475a;

            /* Text colours */
            --text-primary:   #cdd6f4;
            --text-secondary: #bac2de;
            --text-muted:     #6c7086;
            --text-inverse:   #11111b;

            /* Accent colours */
            --accent-primary: #89b4fa;
            --accent-primary-hover: #b4d0fb;
            --accent-secondary: #a6e3a1;
            --accent-peach:  #fab387;
            --accent-info:   #89dceb;
            --accent-warning: #f9e2af;

            /* Status colours */
            --success:        #a6e3a1;
            --error:          #f38ba8;
            --warning:        #f9e2af;
            --info:           #89b4fa;

            /* Borders */
            --border-default: #313244;
            --border-light:   #45475a;
            --border-focus:   #89b4fa;
            --border-accent:  rgba(137, 180, 250, 0.12);

            /* Spacing */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            --font-size-xs:   10px;
            --font-size-sm:   11px;
            --font-size-base: 13px;
            --font-size-md:   14px;
            --font-size-lg:   16px;
            --font-size-xl:   18px;

            /* Radius */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;

            /* Shadows */
            --shadow-sm:    0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md:    0 4px 6px rgba(0, 0, 0, 0.4);
            --shadow-lg:    0 10px 20px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.25);

            /* Transitions */
            --transition-fast:   0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow:   0.35s ease;

            /* Z-Index */
            --z-base:           1;
            --z-dropdown:       100;
            --z-sidebar:        200;
            --z-overlay:        500;
            --z-modal-backdrop: 1000;
            --z-modal:          1001;
            --z-toast:          1100;
            --z-tooltip:        1300;

            /* UI Chrome */
            --header-gradient: linear-gradient(135deg, rgba(137, 180, 250, 0.06) 0%, rgba(137, 180, 250, 0.02) 40%, transparent 70%);
            --overlay-muted:  #585b70;
            --modal-backdrop: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--bg-primary);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-family: var(--font-sans);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-default);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            font-size: 14px;
            color: var(--text-muted);
        }

        .error-message {
            font-size: 14px;
            color: var(--error);
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .retry-btn:hover { background: var(--accent-primary-hover); }
    </style>
</head>
<body>
    <video id="video" autoplay muted playsinline></video>

    <div class="overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="message">Connecting to camera...</div>
    </div>

    <div class="overlay" id="errorOverlay" style="display:none">
        <div class="error-message" id="errorText"></div>
        <button class="retry-btn" onclick="startPlayer()">Retry</button>
    </div>

    <script src="/data/camera-driver/mse-player.js"></script>
    <script>
        var API_BASE = '/data/camera-driver';
        var player = null;

        function getDeviceName() {
            return new URLSearchParams(window.location.search).get('device');
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('errorOverlay').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorOverlay').style.display = 'flex';
        }

        function stopStream() {
            if (player) { player.stop(); player = null; }
        }

        async function startPlayer() {
            stopStream();

            var device = getDeviceName();
            if (!device) {
                showError('No device specified. Add ?device=YourDeviceName to the URL.');
                return;
            }

            showLoading();

            var videoEl = document.getElementById('video');
            player = new MsePlayer(videoEl, showError);

            videoEl.addEventListener('playing', function () {
                hideLoading();
            }, { once: true });

            await player.start(API_BASE + '/stream?device=' + encodeURIComponent(device));
        }

        document.addEventListener('DOMContentLoaded', startPlayer);
    </script>
</body>
</html>
